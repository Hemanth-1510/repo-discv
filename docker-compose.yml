version: '3.8'

services:
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=masterKey_at_least_16_chars_long
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ./meili_data:/meili_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  search-api:
    build: .
    container_name: search-api
    ports:
      - "8000:8000"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=masterKey_at_least_16_chars_long
    depends_on:
      meilisearch:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./:/app
    command: uvicorn search_api:app --host 0.0.0.0 --port 8000 --reload

volumes:
  meili_data:
